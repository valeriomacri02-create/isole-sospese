<style>
/* Layout: the hand-drawn arena fills the screen height at the sketch's own proportions; menu cards overlay it; one line of controls below. Single dark "notebook" theme, taken from the drawing. */
:root{
  --bg:#1e1e20; --paper:#2c2c2e; --ink:#f4f1ea; --muted:#a3a09a; --lava:#b3171b; --crate:#d9822b; --guard:#7cc0ff;
  --hand:"Patrick Hand", "Comic Sans MS", "Chalkboard SE", cursive;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--hand); box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:10px}
.stage{position:relative; height:calc(100% - 52px); max-height:100%; aspect-ratio:730/850; max-width:100%; background:var(--paper); border-radius:6px; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none}
canvas{display:block; width:100%; height:100%}
.legend{display:flex; flex-wrap:wrap; justify-content:center; gap:2px 14px; font-size:17px; color:var(--muted); max-width:900px}
.legend b{color:var(--ink); font-weight:400; border:1px solid #4a4a4d; border-bottom-width:2px; border-radius:4px; padding:0 6px; background:#2a2a2c}
.menu{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(22,22,24,.82); text-align:center; padding:16px; overflow:auto}
.menu h1{margin:0; font-weight:400; font-size:clamp(36px,7vw,58px); line-height:1; text-wrap:balance}
.menu .step{margin:0; font-size:24px; color:var(--crate)}
.roster{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; width:100%; max-width:520px}
.card{display:flex; flex-direction:column; align-items:center; gap:2px; background:#252527; border:2px solid #444; border-radius:10px; padding:8px 6px 10px; color:var(--ink); font:inherit; cursor:pointer}
.card:hover, .card:focus-visible{border-color:var(--crate); outline:none}
.card[aria-disabled="true"]{opacity:.35; cursor:default}
.card canvas{width:100px; height:84px}
.stats{display:grid; gap:3px; width:100%; max-width:200px; margin-top:6px}
.st{display:grid; grid-template-columns:62px 1fr 18px; align-items:center; gap:6px; font-size:15px; color:var(--muted); text-align:left}
.st i{height:8px; border-radius:2px; background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), #252527 calc(10% - 2px) 10%), linear-gradient(90deg, var(--crate) calc(var(--v) * 10%), #45454a 0)}
.st b{font-weight:400; color:var(--ink); text-align:right}
.diffs{display:flex; flex-direction:column; gap:8px; width:100%; max-width:340px}
.diffs .btn{display:flex; justify-content:space-between; align-items:baseline; gap:12px; text-align:left}
.diffs .btn small{font-size:16px; color:var(--muted)}
.card strong{font-weight:400; font-size:24px; line-height:1}
.card small{font-size:15px; color:var(--muted); line-height:1.2}
.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.stages{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; width:100%; max-width:560px}
.stages .card canvas{width:100%; height:auto; aspect-ratio:4/3; border-radius:6px}
.online{display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; max-width:420px}
.onote{margin:0; font-size:18px; color:var(--muted); line-height:1.3}
.onmain{display:flex; flex-direction:column; align-items:center; gap:10px; width:100%}
.onwait{display:flex; flex-direction:column; align-items:center; gap:4px}
.onwait strong{font-weight:400; font-size:54px; letter-spacing:.12em; color:var(--crate); line-height:1}
.onstat{margin:0; font-size:18px; color:var(--muted)}
.onlist{display:flex; flex-direction:column; gap:6px; width:100%}
.onlist .btn{font-size:19px}
#onCode{font:24px var(--hand); width:7ch; text-align:center; text-transform:lowercase; background:#252527; color:var(--ink); border:2px solid #555; border-radius:8px; padding:2px 8px}
#onCode:focus-visible{outline:2px solid var(--crate); outline-offset:2px}
.lang{display:flex; align-items:center; gap:8px; font-size:18px; color:var(--muted)}
.pill{font:18px var(--hand); color:var(--muted); background:transparent; border:1px solid #555; border-radius:999px; padding:2px 12px; cursor:pointer}
.pill[aria-pressed="true"]{color:var(--ink); border-color:var(--crate)}
.pill:focus-visible{outline:2px solid var(--crate); outline-offset:2px}
.btn{font:22px var(--hand); color:var(--ink); background:transparent; border:2px solid var(--ink); border-radius:8px; padding:4px 18px; cursor:pointer}
.btn.main{color:var(--crate); border-color:var(--crate)}
.btn:focus-visible{outline:2px solid var(--crate); outline-offset:2px}
.touch{position:absolute; left:0; right:0; bottom:0; display:none; justify-content:space-between; padding:8px; pointer-events:none}
.touch .g{display:flex; gap:6px; flex-wrap:wrap; max-width:50%}
.touch button{pointer-events:auto; width:50px; height:50px; border-radius:50%; border:2px solid rgba(244,241,234,.5); background:rgba(30,30,32,.55); color:var(--ink); font:16px var(--hand); touch-action:none}
@media (hover:none) and (pointer:coarse){ .touch{display:flex} .legend .kb{display:none} }
</style>

<div class="stage" id="stage">
  <canvas id="c" aria-label="Arena di combattimento"></canvas>
  <div class="touch" id="touch">
    <div class="g"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="down">▼</button></div>

        <div class="onlist" id="onList"></div>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="trainBtn" type="button" hidden></button>
      <button class="btn main" id="onlineBtn" type="button" hidden></button>
      <button class="btn" id="backBtn" type="button" hidden></button>
      <button class="btn main" id="resumeBtn" type="button" hidden></button>
    </div>
    <div class="lang" id="langRow"><span id="langLabel"></span><button type="button" class="pill" data-lang="it">Italiano</button><button type="button" class="pill" data-lang="en">English</button></div>
  </div>
</div>

<script>

const cv = document.getElementById('c'); let ctx = cv.getContext('2d');

new ResizeObserver(resize).observe(cv); resize();
const R = Math.random, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;

const OLIVE = '#b4a62c', RUST = '#a3502a';
const trees = [
  { cx: 260, cy: 157, rx: 55, ry: 36, tx: 255, base: 275, fruit: OLIVE },
  { cx: 552, cy: 95,  rx: 50, ry: 32, tx: 550, base: 198, fruit: OLIVE },
  { cx: 110, cy: 277, rx: 57, ry: 38, tx: 115, base: 400, fruit: OLIVE },
  { cx: 600, cy: 310, rx: 53, ry: 32, tx: 595, base: 401, fruit: RUST },
  { cx: 150, cy: 552, rx: 60, ry: 42, tx: 145, base: 703, fruit: RUST },
  { cx: 520, cy: 557, rx: 55, ry: 40, tx: 510, base: 703, fruit: RUST }

const crateDefs = [
  { x: 200, y: 668, w: 62, h: 35 }, { x: 395, y: 663, w: 65, h: 40 },
  { x: 360, y: 128, w: 75, h: 45 }, { x: 415, y: 322, w: 80, h: 40 },
  { x: 410, y: 432, w: 35, h: 40 }, { x: 282, y: 462, w: 31, h: 36 }
];
let crates = [];
const resetCrates = () => { crates = ST.crates.map(c => ({ ...c, hp: 3, dead: false, respawn: 0, shake: 0, fade: 1 })); };
const oneWayList = [
  ...plats.map(p => ({ x: p.x + 4, w: p.w - 8, y: p.y })),
  ...trees.map(t => ({ x: t.cx - t.rx * 0.8, w: t.rx * 1.6, y: t.cy - t.ry + 8 }))
];
let seed = 7; const sr = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const jit = plats.map(() => Array.from({ length: 12 }, () => (sr() - 0.5) * 3));
const fruitPos = trees.map(t => Array.from({ length: 3 }, (_, i) => ({ x: t.cx - t.rx * 0.45 + i * t.rx * 0.42 + (sr() - .5) * 8, y: t.cy - 4 + (sr() - .5) * 16 })));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ---------- stage 2: Colline rigogliose, traced from the second sketch ---------- */
const domes = [ // back row first, then front row; every hill can be walked on
  { cx: 90,  top: 445, rx: 150, ry: 60, c: '#a8a32a' },
  { cx: 290, top: 458, rx: 125, ry: 55, c: '#c21fcf' },
  { cx: 530, top: 445, rx: 150, ry: 60, c: '#6b3410' },
  { cx: 760, top: 435, rx: 140, ry: 60, c: '#a9661e' },
  { cx: 150, top: 520, rx: 260, ry: 70, c: '#20c626' },
  { cx: 480, top: 528, rx: 230, ry: 75, c: '#a8661d', streak: true },
  { cx: 760, top: 525, rx: 170, ry: 70, c: '#22b82a' }
];
const hatch = domes.map(d => Array.from({ length: Math.round(d.rx / 9) }, () => ({ x: d.cx + (sr() * 2 - 1) * d.rx, y: d.top + 12 + sr() * 150 })));
function hillsHeight(x){
  let best = Infinity;
  for (const d of domes){ const u = (x - d.cx) / d.rx; if (Math.abs(u) < 1){ const y = d.top + d.ry * (1 - Math.sqrt(1 - u * u)); if (y < best) best = y; } }
  return best === Infinity ? 705 : best;
}
const clouds = [ { x: 129, y: 38, w: 160, h: 74 }, { x: 409, y: 30, w: 163, h: 80 }, { x: 229, y: 172, w: 147, h: 76 }, { x: 656, y: 115, w: 153, h: 75 } ];
const cloudBlobs = clouds.map(c => Array.from({ length: 7 }, (_, i) => ({ x: c.x + 18 + i * (c.w - 36) / 6, y: c.y + c.h * (0.45 + (i % 2 ? -0.12 : 0.12)) + (sr() - .5) * 8, r: c.h * (0.3 + sr() * 0.12) })));
// volcano walls as [topX, topY, bottomX, bottomY]; the crater is open only at the top
const volcanoes = [
  { l: [84, 232, 49, 412], r: [187, 235, 249, 418], lava: 396 },
  { l: [614, 238, 559, 410], r: [729, 235, 804, 405], lava: 388 }
];
// extend each wall along its slope until it touches the hills, so the crater can only be entered from the top
for (const v of volcanoes) for (const w of [v.l, v.r]){
  const dx = (w[2] - w[0]) / (w[3] - w[1]);
  let y = w[3]; while (y < 700 && y < hillsHeight(w[0] + dx * (y - w[1])) + 8) y += 2;
  w[2] = w[0] + dx * (y - w[1]); w[3] = y;
}
function wallRects(w){
  const out = [], [x0, y0, x1, y1] = w;
  for (let y = y0; y < y1; y += 14){ const x = lerp(x0, x1, (y - y0) / (y1 - y0)); out.push({ x: x - 7, y, w: 14, h: 14 }); }
  return out;
}
const volcanoSolids = volcanoes.flatMap(v => [...wallRects(v.l), ...wallRects(v.r)]);
function inCrater(v, x, y){
  if (y < v.l[1] + 4) return false;
  const tl = clamp((y - v.l[1]) / (v.l[3] - v.l[1]), 0, 1), tr = clamp((y - v.r[1]) / (v.r[3] - v.r[1]), 0, 1);
  return x > lerp(v.l[0], v.l[2], tl) + 7 && x < lerp(v.r[0], v.r[2], tr) - 7 && y <= v.lava + 70;
}

const STAGES = {
  forest: { key: 'forest', W: 730, H: 850, lavaY: LAVA, solids: [ground], oneWay: oneWayList, crates: crateDefs,

  hills:  { key: 'hills', W: 848, H: 705, lavaY: 0, solids: volcanoSolids, oneWay: clouds.map(c => ({ x: c.x + 12, w: c.w - 24, y: c.y + 14 })), crates: [],
            spawn: [300, 500], center: 424, floorAt: x => hillsHeight(x), heightAt: hillsHeight }
};
let ST = STAGES.forest;
const solids = () => [...ST.solids, ...crates.filter(c => !c.dead)];
function supportBelow(x, feet){
  if (ST.heightAt) return !volcanoes.some(v => inCrater(v, x, feet + 6));
  for (const s of solids()) if (x > s.x && x < s.x + s.w && s.y >= feet - 4) return true;
  for (const s of ST.oneWay) if (x > s.x && x < s.x + s.w && s.y >= feet - 4) return true;
  return false;
}

    light: { name: 'pugno', dur: .16, a0: .04, a1: .12, box: [6, -46, 36, 16], dmg: 5, kb: 170, cd: .17, stun: .2 },
    heavy: { name: 'calcio', dur: .3, a0: .1, a1: .22, box: [4, -30, 46, 22], dmg: 12, kb: 380, cd: .32, stun: .35, airHover: true } },
  manone: { name: 'Manone', stats: { vita: 4, vel: 8, des: 7, forza: 5 }, jump: 730, djump: 690, w: 34, h: 52,
    light: { name: 'pugno leggero', dur: .2, a0: .06, a1: .14, box: [10, -64, 52, 28], dmg: 6, kb: 210, cd: .2, stun: .22 },
    heavy: { name: 'pugno pesante', dur: .5, a0: .26, a1: .36, box: [8, -70, 66, 44], dmg: 16, kb: 480, cd: .42, stun: .45 } },
  stecco: { name: 'Stecco', stats: { vita: 6, vel: 7, des: 5, forza: 6 }, jump: 780, djump: 710, w: 22, h: 62,
    light: { name: 'bastonata leggera', dur: .2, a0: .06, a1: .14, box: [4, -70, 46, 42], dmg: 6, kb: 200, cd: .2, stun: .22 },
    heavy: { name: 'bastonata pesante', dur: .54, a0: .3, a1: .4, box: [0, -74, 60, 70], dmg: 16, kb: 460, cd: .44, stun: .45 } },
  spadina: { name: 'Spadina', stats: { vita: 7, vel: 4, des: 4, forza: 9 }, jump: 750, djump: 700, w: 30, h: 50,

  return { key, C, D, maxHp: D.maxHp, x, y: spawnY(x, C.h), w: C.w, h: C.h, vx: 0, vy: 0, face: cpu ? -1 : 1, ground: false, onOneWay: false, jumps: 0, coyote: 0, drop: 0,
    atk: null, cd: 0, dcd: 0, spin: 0, anim: 0, inv: 1, spawnInv: 1, land: 0, hp: D.maxHp, gm: 100, guarding: false, guardStart: 0, stun: 0, broken: 0,
    dodge: null, airDodged: false, dead: 0, hurt: 0, trail: [], cpu, spawnX: x, downHeld: 0,
    ai: { cd: 1, guardT: 0, guardDelay: 0, reacted: false, think: 0, idleT: 0 } };
}
const cx = f => f.x + f.w / 2, feet = f => f.y + f.h;
let player = null, cpu = null, fighters = [], mode = 'menu';
let score = { you: 0, cpu: 0 }, broken = 0, combo = 0, comboT = 0, best = 0, shake = 0, hitstop = 0, time = 0, banner = null;
const parts = [], floats = [];
function puff(x, y, n, col, sp){ for (let i = 0; i < n; i++){ const a = R() * Math.PI * 2, v = sp * (0.3 + R() * 0.7); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.3, life: 0.5 + R() * 0.3, max: 0.8, c: col, s: 3 + R() * 4, g: 1 }); } }
function float(x, y, t, c, size){ floats.push({ x, y, t, c, life: 0.9, size: size || 24 }); }

function respawn(f){
  Object.assign(f, { x: f.spawnX, y: spawnY(f.spawnX, f.h), vx: 0, vy: 0, hp: f.maxHp, gm: 100, dead: 0, inv: 1.2, spawnInv: 1.2, atk: null, stun: 0, dodge: null, jumps: 0, guarding: false });
}
function ko(t){
  if (t.dead) return;
  t.dead = 1.6; t.vy = -520; t.atk = null; t.guarding = false; sfx.ko(); shake = 0.4;
  if (fighters.length > 1 && !t.remote){ if (t === player) score.cpu++; else score.you++; banner = { t: 0, txt: t === player ? T('youKO') : 'K.O.!' }; }
}
function damage(t, n){ t.hp = Math.max(0, t.hp - n); t.hurt = 0.12; if (t.hp <= 0) ko(t); }

function applyHit(att, tgt, mv, heavy){
  if (tgt.remote){
    // online: the defender's own page decides block, parry and damage; we only send the hit
    netEvent({ k: 'h', d: mv.dmg, kb: Math.round(mv.kb), s: mv.stun, hv: heavy ? 1 : 0 });
    hitstop = heavy ? 0.06 : 0.04; sfx.hit(heavy); rumble(heavy);
    puff(cx(tgt), tgt.y + tgt.h * 0.4, heavy ? 10 : 5, '#ffffff', heavy ? 240 : 150);
    combo = comboT > 0 ? combo + 1 : 1; comboT = 1.4; best = Math.max(best, combo);
    return;
  }
  const front = Math.sign(cx(att) - cx(tgt)) === tgt.face || cx(att) === cx(tgt);
  if (tgt.guarding && front){
    if (time - tgt.guardStart < 0.16){
      if (att.remote) netEvent({ k: 'p' }); else { att.stun = 0.6; att.atk = null; att.vx = -att.face * 220; }
      sfx.parry(); hitstop = 0.08;
      float(cx(tgt), tgt.y - 14, T('perfect'), '#7cc0ff', 26); puff(cx(tgt) + tgt.face * 14, tgt.y + 20, 10, '#bfe2ff', 200);
      return;
    }
    tgt.gm -= heavy ? 38 : 16; tgt.vx = att.face * mv.kb * 0.35; sfx.block(); puff(cx(tgt) + tgt.face * 14, tgt.y + 22, 6, '#bfe2ff', 150);
    if (tgt.gm <= 0){ tgt.gm = 0; tgt.guarding = false; tgt.stun = 0.9; tgt.broken = 0.9; float(cx(tgt), tgt.y - 14, T('broken'), '#ff8a5c', 26); }
    else float(cx(tgt), tgt.y - 10, T('blocked'), '#bfe2ff', 20);
    return;
  }
  tgt.vx = att.face * mv.kb; tgt.vy = -mv.kb * 0.45; tgt.stun = mv.stun; tgt.atk = null; tgt.ground = false;
  hitstop = heavy ? 0.08 : 0.05; shake = Math.max(shake, heavy ? 0.22 : 0.1); sfx.hit(heavy);
  if (tgt === player || att === player) rumble(heavy || tgt === player);
  puff(cx(tgt), tgt.y + tgt.h * 0.4, heavy ? 12 : 6, '#ffffff', heavy ? 260 : 160);
  float(cx(tgt), tgt.y - 8, `-${mv.dmg}`, '#ffd36b', heavy ? 28 : 22);
  if (att === player){ combo = comboT > 0 ? combo + 1 : 1; comboT = 1.4; best = Math.max(best, combo); }
  damage(tgt, mv.dmg);
}

function playerInput(dt){
  for (const k of ['jump', 'light', 'heavy']) buf[k] -= dt;
  buf.dodgeT = (buf.dodgeT || 0) - dt;
  const kdir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const inp = { dir: kdir || pad.x, jump: buf.jump > 0, down: keys.down, light: buf.light > 0, heavy: buf.heavy > 0, guard: keys.guard, dodge: buf.dodgeT > 0 ? buf.dodge : 0 };
  return inp;
}
function consume(f, what){ if (f !== player) return; if (what === 'dodge') buf.dodgeT = 0; else buf[what] = 0; }

function aiInput(f, dt){
  const inp = { dir: 0, jump: false, down: false, light: false, heavy: false, guard: false, dodge: 0, faceTo: 0, dropNow: false };
  const T = player;
  if (!T || T.dead) return inp;
  const L = DIFFS[diff];
  const a = f.ai; a.cd -= dt; a.guardT -= dt; a.guardDelay -= dt; a.think -= dt; a.idleT -= dt;
  const dx = cx(T) - cx(f), adx = Math.abs(dx), dy = feet(T) - feet(f);
  const reach = f.D.light.box[0] + f.D.light.box[2];
  inp.faceTo = Math.sign(dx) || f.face;
  // recover towards the main platform if falling over lava
  if (!f.ground && !supportBelow(cx(f), feet(f))){ inp.dir = Math.sign(ST.center - cx(f)); if (f.vy > -50 && f.jumps < 2) inp.jump = true; return inp; }
  // defence
  if (T.atk && T.atk.t < 0.12 && adx < 120 && Math.abs(dy) < 60 && !a.reacted){
    a.reacted = true; const r = R();
    if (r < L.guard){
      // stronger bots wait and raise the guard right before the hit: a perfect parry
      a.guardDelay = R() < L.perfect ? Math.max(0, T.atk.mv.a0 - T.atk.t - 0.07) : 0;
      a.guardT = a.guardDelay + 0.3 + R() * 0.2;
    } else if (r < L.guard + L.dodge && f.dcd <= 0) inp.dodge = -(Math.sign(dx) || 1);
  }
  if (!T.atk) a.reacted = false;
  if (a.guardT > 0){ inp.guard = a.guardDelay <= 0; return inp; }
  // weaker bots get distracted now and then
  if (a.think <= 0){ a.think = 1 + R(); if (R() < L.idle) a.idleT = 0.5 + R() * 0.8; }
  if (a.idleT > 0) return inp;
  // stronger bots punish a stunned opponent or a missed attack
  const open = T.stun > 0 || (T.atk && T.atk.t > T.atk.mv.a1);
  if (L.punish && open && adx < reach + 10 && Math.abs(dy) < 46 && !f.atk && f.cd <= 0){
    if (T.broken > 0 || R() < L.heavy) inp.heavy = true; else inp.light = true;
    a.cd = L.cd[0]; return inp;
  }
  let want = adx > reach * 0.75 ? Math.sign(dx) : 0;
  if (dy < -50){
    if (f.ground && adx < 180) inp.jump = true;
    else if (!f.ground && f.vy > -60 && f.jumps < 2 && feet(f) > feet(T) + 10) inp.jump = true;
  } else if (dy > 60 && f.ground && f.onOneWay && adx < 150) inp.dropNow = true;
  if (want && f.ground && !supportBelow(cx(f) + want * 28, feet(f))){ if (dy < -40) inp.jump = true; else want = 0; }
  inp.dir = want * L.chase;
  if (adx < reach + 8 && Math.abs(dy) < 46 && a.cd <= 0 && !f.atk){
    if (R() < L.heavy) inp.heavy = true; else inp.light = true;
    a.cd = L.cd[0] + R() * L.cd[1];
  }
  return inp;
}

function stepFighter(f, inp, dt){
  if (f.dead){ f.dead -= dt; f.y += f.vy * dt; f.vy += 1200 * dt; f.spin += dt * 2; if (f.dead <= 0) respawn(f); return; }
  const C = f.C;
  f.stun -= dt; f.cd -= dt; f.dcd -= dt; f.inv -= dt; f.spawnInv -= dt; f.hurt -= dt; f.broken -= dt;
  f.land = Math.max(0, f.land - dt * 5); f.spin = Math.max(0, f.spin - dt / 0.38);
  for (const t of f.trail) t.a -= dt * 4; f.trail = f.trail.filter(t => t.a > 0);
  const canAct = f.stun <= 0 && !f.dodge;
  // guard
  const wantGuard = canAct && inp.guard && !f.atk && f.gm > 0;
  if (wantGuard && !f.guarding){
    f.guarding = true; f.guardStart = time;
    const foe = fighters.find(o => o !== f && !o.dead);
    if (foe && Math.abs(cx(foe) - cx(f)) < 260) f.face = Math.sign(cx(foe) - cx(f)) || f.face;
  }
  else if (!wantGuard) f.guarding = false;
  if (!f.guarding) f.gm = Math.min(100, f.gm + 24 * dt);
  // dodge
  if (canAct && inp.dodge && f.dcd <= 0 && !f.atk && (f.ground || !f.airDodged)){
    f.dodge = { t: 0, dir: inp.dodge }; f.dcd = 0.5; f.inv = 0.24; f.guarding = false; if (!f.ground) f.airDodged = true; sfx.dodge(); consume(f, 'dodge');
  }
  // horizontal
  if (f.dodge){
    f.dodge.t += dt; const k = f.dodge.t / 0.22;
    f.vx = f.dodge.dir * f.D.speed * 3.2 * (1 - k * 0.7); if (!f.ground) f.vy = Math.min(f.vy, 40);
    f.trail.push({ x: f.x, y: f.y, a: 0.8 });
    if (k >= 1) f.dodge = null;
  } else if (f.stun > 0){
    f.vx -= f.vx * Math.min(1, (f.ground ? 7 : 1.2) * dt);
  } else {
    const dir = f.guarding ? 0 : inp.dir;
    const target = dir * f.D.speed * (f.atk && f.ground ? 0.3 : 1);
    const acc = f.ground ? 2600 : 1600;
    f.vx += clamp(target - f.vx, -acc * dt, acc * dt);
    if (!f.atk){ if (dir) f.face = Math.sign(dir); else if (inp.faceTo) f.face = inp.faceTo; }
  }
  f.anim += Math.abs(f.vx) * dt * 0.06;
  // jump / drop
  f.coyote = f.ground ? 0.09 : f.coyote - dt;
  f.downHeld = inp.down ? f.downHeld + dt : 0;
  if (canAct && !f.guarding && inp.jump){
    if (inp.down && f.ground && f.onOneWay){ f.drop = 0.25; consume(f, 'jump'); }
    else if (f.coyote > 0){ f.vy = -C.jump; f.jumps = 1; f.coyote = 0; f.ground = false; sfx.jump(); puff(cx(f), feet(f), 6, '#d8d4cc', 120); consume(f, 'jump'); }
    else if (f.jumps < 2){ f.vy = -C.djump; f.jumps = 2; f.spin = 1; sfx.djump(); puff(cx(f), feet(f), 10, '#ffffff', 180); consume(f, 'jump'); }
  }
  if ((inp.dropNow || f.downHeld > 0.12) && f.ground && f.onOneWay) f.drop = 0.25;
  f.drop -= dt;
  f.vy = Math.min(1100, f.vy + 2000 * dt);
  // attacks
  if (canAct && !f.atk && !f.guarding && f.cd <= 0 && (inp.light || inp.heavy)){
    const heavy = !!inp.heavy, mv = heavy ? f.D.heavy : f.D.light;
    f.atk = { mv, heavy, t: 0, done: new Set() }; f.cd = mv.cd; sfx.swing(heavy); consume(f, heavy ? 'heavy' : 'light');
  }
  if (f.atk){
    const a = f.atk, mv = a.mv; a.t += dt;
    if (mv.lunge && a.t > mv.a0 && a.t < mv.a1) f.vx = f.face * mv.lunge;
    if (mv.airHover && !f.ground && a.t < 0.14) f.vy = Math.min(f.vy, 120);
    if (a.t >= mv.a0 && a.t <= mv.a1){
      const [ox, oy, bw, bh] = mv.box, c = cx(f), ft = feet(f);
      const box = { x: f.face > 0 ? c + ox : c - ox - bw, y: ft + oy, w: bw, h: bh };
      for (const o of fighters){
        if (o === f || o.dead || o.inv > 0 || a.done.has(o) || !overlap(box, o)) continue;
        a.done.add(o); applyHit(f, o, mv, a.heavy);
        if (!f.atk) break;
      }
      if (f.atk) for (const c2 of crates){
        if (c2.dead || a.done.has(c2) || !overlap(box, c2)) continue;
        a.done.add(c2); c2.hp -= a.heavy ? 2 : 1; c2.shake = 0.18; hitstop = Math.max(hitstop, 0.04); sfx.hit(a.heavy);
        puff(box.x + (f.face > 0 ? box.w : 0), box.y + box.h / 2, 6, '#f2b25c', 160);
        if (f === player){ combo = comboT > 0 ? combo + 1 : 1; comboT = 1.4; best = Math.max(best, combo); if (combo > 1) float(c2.x + c2.w / 2, c2.y - 8, `COMBO ×${combo}`, '#ffd36b'); }
        if (c2.hp <= 0){
          c2.dead = true; c2.respawn = 5; sfx.brk(); shake = 0.25; if (f === player) broken++;
          for (let i = 0; i < 14; i++) parts.push({ x: c2.x + R() * c2.w, y: c2.y + R() * c2.h, vx: (R() - .5) * 420 + f.face * 120, vy: -200 - R() * 300, life: 0.9, max: 0.9, c: i % 2 ? '#d9822b' : '#9c5a1c', s: 5 + R() * 6, g: 1, rot: R() * 6 });
        }
      }
    }
    if (f.atk && a.t >= mv.dur) f.atk = null;
  }
  // collisions
  const oldX = f.x;
  f.x += f.vx * dt;
  if (ST.heightAt && f.ground && ST.heightAt(cx(f)) < feet(f) - 24){ f.x = oldX; f.vx = 0; }   // hill too steep to walk up
  for (const s of solids()) if (overlap(f, s)){ if (f.vx > 0 || cx(f) < s.x + s.w / 2) f.x = s.x - f.w; else f.x = s.x + s.w; f.vx = 0; }
  f.x = clamp(f.x, 0, W - f.w);
  const prevBottom = feet(f), wasGround = f.ground;
  f.y += f.vy * dt; f.ground = false; f.onOneWay = false;
  for (const s of solids()){
    if (!overlap(f, s)) continue;
    if (f.vy >= 0 && prevBottom <= s.y + 6){ f.y = s.y - f.h; f.vy = 0; f.ground = true; }
    else if (f.vy < 0){ f.y = s.y + s.h; f.vy = 0; }
  }
  if (f.vy >= 0 && f.drop <= 0){
    for (const s of ST.oneWay) if (f.x + f.w > s.x && f.x < s.x + s.w && prevBottom <= s.y + 2 && feet(f) >= s.y){ f.y = s.y - f.h; f.vy = 0; f.ground = true; f.onOneWay = true; }
  }
  if (ST.heightAt){
    const g = ST.heightAt(cx(f));
    if (f.vy >= 0 && feet(f) >= g){ f.y = g - f.h; f.vy = 0; f.ground = true; }
    if (f.y < -80){ f.y = -80; f.vy = Math.max(f.vy, 0); }
  }
  if (f.ground){ f.jumps = 0; f.airDodged = false; if (!wasGround){ f.land = 1; if (f === player) sfx.land(); } }
  if (ST.key === 'hills' && !f.dead) hillsHazards(f);
  // lava
  if (ST.lavaY && feet(f) > ST.lavaY + 6){
    sfx.lava(); shake = 0.35; if (f === player) combo = 0;
    for (let i = 0; i < 24; i++) parts.push({ x: cx(f) + (R() - .5) * 30, y: LAVA, vx: (R() - .5) * 300, vy: -250 - R() * 350, life: 0.8, max: 0.8, c: i % 2 ? '#ff5a2a' : '#ffb347', s: 4 + R() * 5, g: 1 });
    float(cx(f), LAVA - 30, T('burned') + ' -25', '#ff8a5c');
    damage(f, 25);
    if (!f.dead){ Object.assign(f, { x: f.spawnX, y: spawnY(f.spawnX, f.h), vx: 0, vy: 0, inv: 1.2, spawnInv: 1.2, atk: null, jumps: 0, stun: 0 }); }
    else { f.y = LAVA; f.vy = -300; }
  }
}

function hillsHazards(f){
  // volcano lava: only reachable by dropping into the crater from above
  for (const v of volcanoes){
    if (inCrater(v, cx(f), feet(f)) && feet(f) >= v.lava){
      sfx.lava(); shake = 0.3; if (f === player) combo = 0;
      for (let i = 0; i < 20; i++) parts.push({ x: cx(f) + (R() - .5) * 30, y: v.lava, vx: (R() - .5) * 260, vy: -300 - R() * 350, life: 0.8, max: 0.8, c: i % 2 ? '#ff5a2a' : '#ffb347', s: 4 + R() * 5, g: 1 });
      float(cx(f), v.lava - 40, T('burned') + ' -20', '#ff8a5c');
      f.y = v.lava - f.h; f.vy = -1180; f.vx = 0; f.jumps = 1; f.inv = Math.max(f.inv, 0.8); f.atk = null;
      damage(f, 20);
      return;
    }
  }
  // the sun burns anyone who touches it
  if (f.inv <= 0 && Math.hypot(cx(f) - SUN.x, f.y + f.h / 2 - SUN.y) < SUN.r + 14){
    sfx.lava(); shake = 0.25;
    puff(cx(f), f.y + f.h / 2, 14, '#ffe34a', 220);
    float(cx(f) + 40, f.y + 20, T('sun') + ' -15', '#ffe34a');
    f.vx = 420; f.vy = 300; f.inv = 0.8; f.stun = 0.3; f.atk = null;
    damage(f, 15);
  }
}

function update(dt){
  time += dt;
  if (net.playing) netTick(dt);
  if (!player) return;
  if (hitstop > 0){ hitstop -= dt; return; }
  const pi = playerInput(dt);
  stepFighter(player, pi, dt);
  if (cpu && !cpu.remote) stepFighter(cpu, aiInput(cpu, dt), dt);
  comboT -= dt; if (comboT <= 0) combo = 0;
  for (const c of crates){
    c.shake = Math.max(0, c.shake - dt);
    if (c.dead){ c.respawn -= dt; if (c.respawn <= 0 && !fighters.some(f => overlap(f, c))){ c.dead = false; c.hp = 3; c.fade = 0; } }
    else c.fade = Math.min(1, c.fade + dt * 3);
  }
  for (const q of parts){ q.x += q.vx * dt; q.y += q.vy * dt; if (q.g) q.vy += 1300 * dt; q.life -= dt; if (q.rot !== undefined) q.rot += dt * 8; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
  for (const f of floats){ f.y -= 45 * dt; f.life -= dt; }
  for (let i = floats.length - 1; i >= 0; i--) if (floats[i].life <= 0) floats.splice(i, 1);
  if (banner){ banner.t += dt; if (banner.t > 1.4) banner = null; }
  shake = Math.max(0, shake - dt);
}

/* ---------- drawing ---------- */
function drawGrid(){
  ctx.fillStyle = '#2c2c2e'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += 25){ ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 0; y <= H; y += 25){ ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();
}
function drawPlat(p, j){
  ctx.fillStyle = '#f7f6f2'; ctx.beginPath();
  ctx.moveTo(p.x + j[0], p.y + j[1]); ctx.lineTo(p.x + p.w * .5, p.y + j[2]); ctx.lineTo(p.x + p.w + j[3], p.y + j[4]);
  ctx.lineTo(p.x + p.w - p.w * .1 + j[5], p.y + p.h + j[6]); ctx.lineTo(p.x + p.w * .5, p.y + p.h + j[7]); ctx.lineTo(p.x + p.w * .1 + j[8], p.y + p.h + j[9]);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x + 10, p.y + 6); ctx.lineTo(p.x + p.w - 10, p.y + 7); ctx.stroke();
}
function drawGround(g){
  ctx.fillStyle = '#c9c9c9';
  ctx.beginPath(); ctx.moveTo(g.x - 8, g.y); ctx.lineTo(g.x + g.w + 8, g.y); ctx.lineTo(g.x + g.w - 30, g.y + g.h); ctx.lineTo(g.x + 30, g.y + g.h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#f3f3f3'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineCap = 'round'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(g.x + 150, g.y + 22); ctx.lineTo(g.x + 300, g.y + 18); ctx.lineTo(g.x + 420, g.y + 12); ctx.stroke();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(g.x + 230, g.y + 28); ctx.lineTo(g.x + 330, g.y + 27); ctx.stroke(); ctx.lineCap = 'butt';
}
function drawTree(t, fr){
  ctx.fillStyle = '#6b3a1c'; ctx.beginPath();
  ctx.moveTo(t.tx - 10, t.cy + t.ry * 0.4); ctx.lineTo(t.tx + 10, t.cy + t.ry * 0.4);
  ctx.quadraticCurveTo(t.tx + 12, t.base - 30, t.tx + 30, t.base); ctx.lineTo(t.tx - 30, t.base);
  ctx.quadraticCurveTo(t.tx - 12, t.base - 30, t.tx - 10, t.cy + t.ry * 0.4); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(t.tx + 2, t.cy + t.ry * 0.4, 4, t.base - t.cy - t.ry * 0.6);
  ctx.fillStyle = '#1f9a27';
  for (const [bx, by, br] of [[0, 0, 1], [-.55, .1, .7], [.55, .1, .7], [-.25, -.35, .7], [.3, -.3, .65], [0, .35, .7]]){ ctx.beginPath(); ctx.ellipse(t.cx + bx * t.rx, t.cy + by * t.ry, t.rx * .55 * br * 1.25, t.ry * .6 * br * 1.25, 0, 0, Math.PI * 2); ctx.fill(); }

function drawSun(){

  ctx.fillStyle = '#c9c414'; ctx.fillRect(0, 0, 90, 90);
  ctx.strokeStyle = '#eceb2e'; ctx.lineWidth = 2;
  for (let i = -90; i < 120; i += 6){ ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 60, 70); ctx.stroke(); }

function drawVolcanoInside(v){

function drawVolcanoWalls(){

function domePath(d){ ctx.beginPath(); ctx.ellipse(d.cx, d.top + d.ry, d.rx, d.ry, 0, Math.PI, 0); ctx.lineTo(d.cx + d.rx, H + 10); ctx.lineTo(d.cx - d.rx, H + 10); ctx.closePath(); }

function drawFighterAt(f, x, y, alpha){
  ctx.save(); ctx.globalAlpha = alpha;

  else if (f.spin > 0){ ctx.translate(0, -f.h / 2); ctx.rotate((1 - f.spin) * Math.PI * 2); ctx.translate(0, f.h / 2); }

  document.getElementById('onlineBtn').hidden = s !== 'opp';

    resumeBtn.hidden = false; backBtn.hidden = false; backBtn.textContent = T('onQuit'); stepEl.textContent = T('online');

  }
  if (s.startsWith('net-')){

function start(you, foe){
  netLeave(); netUI = null;
  useStage(stageKey);
  resetCrates(); parts.length = 0; floats.length = 0; score = { you: 0, cpu: 0 }; broken = 0; combo = 0; best = 0; banner = null;
  const [sx1, sx2] = ST.spawn;
  player = mkFighter(you, sx1, false);
  cpu = foe ? mkFighter(foe, sx2, true) : null;
  fighters = cpu ? [player, cpu] : [player];
  closeMenu();
}
function closeMenu(){ menu.hidden = true; mode = 'play'; }
trainBtn.addEventListener('click', () => { opp = null; setStep(); });
function currentStep2(){ return net.playing ? 'net-paused' : netUI ? 'net-' + netUI : currentStep(); }
const currentStep = () => !pick ? 'you' : opp === undefined ? 'opp' : (opp && !diffChosen) ? 'diff' : 'stage';
backBtn.addEventListener('click', () => {
  if (net.playing){ quitOnline(); return; }
  if (netUI){ if (netUI === 'stage') netUI = 'online'; else { netLeave(); netUI = null; } setStep(); return; }
  const s = currentStep();
  if (s === 'stage'){ if (opp === null) opp = undefined; else diffChosen = false; }
  else if (s === 'diff') opp = undefined;
  else pick = null;
  setStep();
});
resumeBtn.addEventListener('click', () => closeMenu());
useStage(stageKey); resetCrates();


/* ---------- online multiplayer (claude.ai room: shared presence) ---------- */
// Each page simulates its own fighter and publishes it in its presence (about 30 times a second).
// Hits travel as events inside presence; the defender's page resolves block, parry and damage.
let netUI = null;
const net = { lobby: null, avail: null, match: null, code: null, host: false, playing: false, oppPeer: null, ev: [], seq: 0, lastSeen: 0,
              remoteDeaths: 0, missing: 0, leftT: 0, status: '', stage: null, oppCh: null, kind: null };
const CODE_RE = /^[a-z0-9]{4,6}$/;
const validCh = c => typeof c === 'string' && Object.prototype.hasOwnProperty.call(CHARS, c);
const validSt = v => typeof v === 'string' && Object.prototype.hasOwnProperty.call(STAGES, v);
// Where online play runs: claude.ai's shared room when the game is opened there,
// otherwise the game's own server (see the isole-server folder).
const GAME_SERVER = '';   // e.g. 'wss://isole-sospese.onrender.com/ws' when the game page is hosted elsewhere (itch.io)
function serverUrl(){
  try { const q = new URLSearchParams(location.search).get('server'); if (q && /^wss?:\/\/[^\s]+$/.test(q)) return q; } catch(e){}
  if (GAME_SERVER) return GAME_SERVER;
  if (/^https?:$/.test(location.protocol) && !/(^|\.)(claude\.ai|claudeusercontent\.com|anthropic\.com)$/.test(location.hostname)) return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  return null;
}
// A small client for our own server with the same calls the game uses on claude.ai's room.
function connectWs(url){
  return new Promise(resolve => {
    let ws = null, me = null, done = false;
    const rooms = new Map();
    const getRoom = name => { let r = rooms.get(name); if (!r){ r = { peers: new Map(), subs: [], pres: {}, dirty: false, snap: Object.freeze([]) }; rooms.set(name, r); } return r; };
    const refresh = name => { const r = getRoom(name); r.snap = Object.freeze([...r.peers].map(([id, p]) => Object.freeze({ peer: id, isMe: id === me, sameTab: id === me, kind: 'viewer', presence: p }))); for (const h of r.subs){ try { h({ peers: r.snap }); } catch(e){} } };
    const send = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
    setInterval(() => { for (const [name, r] of rooms) if (r.dirty){ r.dirty = false; send({ t: 'pres', room: name, p: r.pres }); } }, 33);
    const api = name => { const r = getRoom(name); return {
      name,
      peers: () => r.snap,
      onPeers: h => { r.subs.push(h); setTimeout(() => h({ peers: r.snap }), 0); return () => { r.subs = r.subs.filter(x => x !== h); }; },
      presence: async patch => { for (const k in patch){ if (patch[k] === null) delete r.pres[k]; else r.pres[k] = patch[k]; } r.dirty = true; },
      leave: async () => { send({ t: 'leave', room: name }); rooms.delete(name); },
      connected: () => !!(ws && ws.readyState === 1)
    }; };
    function open(){
      try { ws = new WebSocket(url); } catch(e){ if (!done){ done = true; resolve(null); } return; }
      ws.onmessage = ev => {
        let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
        if (!m || typeof m !== 'object') return;
        if (m.t === 'hello'){
          me = String(m.id);
          if (!done){ done = true; const lobby = api('lobby'); lobby.join = async name => { getRoom(name); send({ t: 'join', room: name }); return api(name); }; resolve(lobby); }
          else { for (const n of [...rooms.keys()]) if (n !== 'lobby') rooms.delete(n); const lb = rooms.get('lobby'); if (lb) lb.dirty = true; }
          return;
        }
        if (typeof m.room !== 'string' || !rooms.has(m.room)) return;
        const r = rooms.get(m.room);
        if (m.t === 'snap'){ r.peers.clear(); for (const q of Array.isArray(m.peers) ? m.peers : []) if (q && typeof q.peer === 'string' && q.peer !== me) r.peers.set(q.peer, q.p && typeof q.p === 'object' ? q.p : {}); r.dirty = true; refresh(m.room); }
        else if (m.t === 'pres' && typeof m.peer === 'string' && m.peer !== me){ r.peers.set(m.peer, m.p && typeof m.p === 'object' ? m.p : {}); refresh(m.room); }
        else if (m.t === 'left' && typeof m.peer === 'string'){ r.peers.delete(m.peer); refresh(m.room); }
      };
      ws.onclose = () => { for (const [n, r] of rooms){ r.peers.clear(); refresh(n); } if (!done){ done = true; resolve(null); } else setTimeout(open, 3000); };
      ws.onerror = () => {};
    }
    open();
    setTimeout(() => { if (!done){ done = true; resolve(null); } }, 60000);   // free servers can take a while to wake up
  });
}
async function getOnline(){
  let r = null;
  if (window.claude && window.claude.use){ try { r = await window.claude.use('room'); } catch(e){ r = null; } }
  if (r){ net.kind = 'claude'; return r; }
  const u = serverUrl();
  if (!u) return null;
  net.kind = 'server'; renderOnline();
  return connectWs(u);
}
getOnline().then(r => {
  net.lobby = r; net.avail = !!r;
  if (r) r.onPeers(() => { if (netUI === 'online') renderOnline(); }, () => { net.avail = false; renderOnline(); });
  renderOnline();
}).catch(() => { net.avail = false; renderOnline(); });

function renderOnline(){
  const onEl = document.getElementById('online'); if (!onEl || onEl.hidden) return;
  const waiting = netUI === 'wait';
  document.getElementById('onWait').hidden = !waiting;
  document.getElementById('onMain').hidden = waiting || !net.avail;
  document.getElementById('onNote').textContent = net.avail === false ? T(net.kind === 'server' ? 'onServerDown' : 'onUnavailable') : net.avail === null ? T('onConnecting') : waiting ? '' : T(net.kind === 'server' ? 'onNoteServer' : 'onNote');
  document.getElementById('onCodeShow').textContent = net.code || '';
  document.getElementById('onCodeLabel').hidden = !net.host;
  document.getElementById('onCodeShow').hidden = !net.host;
  document.getElementById('onStatus').textContent = net.status;
  if (waiting || !net.avail) return;
  const list = document.getElementById('onList'); list.innerHTML = '';
  const open = net.lobby.peers().filter(p => !p.sameTab && p.presence && typeof p.presence.host === 'string' && CODE_RE.test(p.presence.host) && validCh(p.presence.ch) && validSt(p.presence.st));
  document.getElementById('onListTitle').textContent = net.status || (open.length ? T('onList') : T('onNone'));
  for (const p of open){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn';
    b.textContent = T('onMatch')(CHARS[p.presence.ch].name, T('stages')[p.presence.st]);
    b.addEventListener('click', () => joinMatch(p.presence.host));
    list.append(b);
  }
}
document.getElementById('onlineBtn').addEventListener('click', () => { net.status = ''; netUI = 'online'; setStep(); setTimeout(() => document.getElementById('onCreate').focus(), 20); });
document.getElementById('onCreate').addEventListener('click', () => { netUI = 'stage'; setStep(); });
document.getElementById('onJoinForm').addEventListener('submit', e => { e.preventDefault(); joinMatch(document.getElementById('onCode').value.trim().toLowerCase()); });

function newCode(){ const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let c = ''; for (let i = 0; i < 4; i++) c += a[Math.floor(R() * a.length)]; return c; }
async function hostMatch(){
  if (!net.lobby) return;
  net.host = true; net.code = newCode(); net.stage = stageKey; netUI = 'wait'; net.status = T('onConnecting'); setStep();
  try {
    net.match = await net.lobby.join('isole-' + net.code);
    await net.match.presence({ role: 'host', ch: pick, st: stageKey });
    await net.lobby.presence({ host: net.code, ch: pick, st: stageKey });
    net.status = T('onWaiting');
  } catch(e){ netLeave(true); net.status = T('onFail'); netUI = 'online'; setStep(); return; }
  renderOnline();
}
async function joinMatch(code){
  if (!net.lobby) return;
  if (!CODE_RE.test(code)){ net.status = T('onBadCode'); renderOnline(); return; }
  net.host = false; net.code = code; netUI = 'wait'; net.status = T('onJoining'); setStep();
  try {
    net.match = await net.lobby.join('isole-' + code);
    await net.match.presence({ role: 'guest', ch: pick });
  } catch(e){ netLeave(true); net.status = T('onFail'); netUI = 'online'; setStep(); return; }
  renderOnline();
}
function netLeave(keepStatus){
  const m = net.match;
  net.match = null; net.playing = false; net.oppPeer = null; net.ev = []; net.seq = 0; net.lastSeen = 0; net.remoteDeaths = 0; net.missing = 0; net.leftT = 0;
  if (!keepStatus){ net.status = ''; net.code = null; }
  if (m) m.leave().catch(() => {});
  if (net.lobby) net.lobby.presence({ host: null, ch: null, st: null }).catch(() => {});
}
function netEvent(e){ e.i = ++net.seq; net.ev.push(e); if (net.ev.length > 8) net.ev.shift(); }

// every frame while waiting in a match room: start as soon as the other player is there
function netWaitTick(){
  if (netUI !== 'wait' || !net.match || net.playing) return;
  const others = net.match.peers().filter(p => !p.sameTab && p.presence && validCh(p.presence.ch));
  const opp = net.host ? others.find(p => p.presence.role === 'guest') : others.find(p => p.presence.role === 'host' && validSt(p.presence.st));
  if (opp) startOnline(net.host ? net.stage : opp.presence.st, opp.presence.ch, opp.peer);
}
function startOnline(stKey, oppCh, oppPeer){
  stageKey = stKey; useStage(stKey);
  crates = [];   // no crates online, so both pages share exactly the same level
  parts.length = 0; floats.length = 0; score = { you: 0, cpu: 0 }; broken = 0; combo = 0; best = 0; banner = null;
  const [sx1, sx2] = ST.spawn;
  player = mkFighter(pick, net.host ? sx1 : sx2, false); player.face = net.host ? 1 : -1;
  cpu = mkFighter(oppCh, net.host ? sx2 : sx1, true); cpu.remote = true; cpu.face = -player.face;
  fighters = [player, cpu];
  Object.assign(net, { playing: true, oppPeer, oppCh, ev: [], seq: 0, lastSeen: 0, remoteDeaths: 0, missing: 0, leftT: 0 });
  if (net.lobby) net.lobby.presence({ host: null, ch: null, st: null }).catch(() => {});
  netUI = null; closeMenu();
}
const r1 = v => Math.round(v * 10) / 10;
function netTick(dt){
  const m = net.match; if (!m || !player) return;
  const f = player;
  const atkType = f.atk ? (f.atk.heavy ? 2 : 1) : 0;
  m.presence({ role: net.host ? 'host' : 'guest', ch: pick, st: net.host ? stageKey : null, dt: score.cpu,
    s: [r1(f.x), r1(f.y), f.face, r1(f.anim), atkType, f.atk ? Math.round(f.atk.t * 100) / 100 : 0, f.guarding ? 1 : 0, r1(f.spin), r1(f.dead), r1(f.hp), f.maxHp, Math.round(f.gm),
        f.dodge ? 1 : 0, f.inv > 0 ? 1 : 0, f.spawnInv > 0 ? 1 : 0, r1(f.land), f.hurt > 0 ? 1 : 0, f.broken > 0 ? 1 : 0, r1(f.vx), f.ground ? 1 : 0],
    ev: net.ev }).catch(() => {});
  const peer = m.peers().find(p => p.peer === net.oppPeer);
  if (!peer){
    net.missing += dt;
    if (net.missing > 1.5 && !net.leftT){ net.leftT = 2.5; banner = { t: 0, txt: T('onLeft') }; }
  } else { net.missing = 0; applyRemote(peer.presence, dt); }
  if (net.leftT){ net.leftT -= dt; if (net.leftT <= 0){ quitOnline(); } }
}
function quitOnline(){ netLeave(); player = null; cpu = null; fighters = []; pick = null; opp = undefined; diffChosen = false; netUI = null; openMenu(false); }
function applyRemote(pr, dt){
  const o = cpu; if (!o || !pr || !Array.isArray(pr.s) || pr.s.length < 20) return;
  const n = i => (typeof pr.s[i] === 'number' && isFinite(pr.s[i])) ? pr.s[i] : 0;
  const k = Math.min(1, dt * 18), tx = clamp(n(0), -50, W + 50), ty = clamp(n(1), -300, H + 300);
  if (Math.abs(tx - o.x) > 150 || Math.abs(ty - o.y) > 150){ o.x = tx; o.y = ty; } else { o.x += (tx - o.x) * k; o.y += (ty - o.y) * k; }
  o.face = n(2) < 0 ? -1 : 1; o.anim = n(3);
  const at = n(4);
  o.atk = at ? { mv: at === 2 ? o.D.heavy : o.D.light, heavy: at === 2, t: n(5), done: new Set() } : null;
  o.guarding = !!n(6); o.spin = n(7); o.dead = n(8); o.hp = clamp(n(9), 0, 999); o.maxHp = Math.max(1, n(10)); o.gm = n(11);
  const dodging = !!n(12); if (dodging) o.trail.push({ x: o.x, y: o.y, a: 0.8 });
  for (const t of o.trail) t.a -= dt * 4; o.trail = o.trail.filter(t => t.a > 0);
  o.dodge = dodging ? { t: 0, dir: o.face } : null; o.inv = (n(13) || dodging) ? 1 : 0; o.spawnInv = n(14) ? 1 : 0; o.land = n(15); o.hurt = n(16) ? 0.1 : 0; o.broken = n(17) ? 1 : 0;
  o.vx = n(18); o.ground = !!n(19);
  // the opponent's deaths are our K.O.s
  const d = typeof pr.dt === 'number' ? Math.max(0, Math.floor(pr.dt)) : 0;
  if (d > net.remoteDeaths){ net.remoteDeaths = d; score.you = d; banner = { t: 0, txt: 'K.O.!' }; sfx.ko(); shake = 0.4; }
  // events from the opponent: hits on us, or our attack parried
  if (Array.isArray(pr.ev)){
    for (const e of pr.ev){
      if (!e || typeof e.i !== 'number' || e.i <= net.lastSeen) continue;
      net.lastSeen = e.i;
      if (player.dead) continue;
      if (e.k === 'h' && player.inv <= 0){
        applyHit(o, player, { dmg: clamp(+e.d || 0, 0, 60), kb: clamp(+e.kb || 0, 0, 900), stun: clamp(+e.s || 0, 0, 1) }, !!e.hv);
      } else if (e.k === 'p'){
        player.stun = 0.6; player.atk = null; player.vx = -player.face * 220; sfx.parry(); float(cx(o), o.y - 14, T('perfect'), '#7cc0ff', 26);
      }
    }
  }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  pollPad(); padToast -= dt; netWaitTick();
  if (mode === 'play') update(dt); else time += dt;
  draw();
  requestAnimationFrame(frame);
}
document.fonts && document.fonts.ready.then(() => { renderPreviews(); if (!stagesEl.hidden) renderStageThumbs(); });
applyLang();
openMenu(false);
requestAnimationFrame(frame);
})();
